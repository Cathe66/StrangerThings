<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkins Lab System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Inter', sans-serif;
            user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
        }
        canvas { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .selected-asset { border: 4px solid #ff69b4 !important; box-shadow: 0 0 20px rgba(255, 105, 180, 0.6); transform: scale(0.96); }
        .stranger-font { font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        #entrance-gate.fade-out { opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }

        .loading-overlay { 
            position: fixed; inset: 0; background: #000; display: flex; align-items: center; 
            justify-content: center; z-index: 300; transition: opacity 1s ease; 
        }
        .loader {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 100px; height: 100px; perspective: 780px;
        }
        .loader .loader-text {
            font-size: 16px; font-weight: 700; color: #cecece; z-index: 10;
        }
        .load-inner { position: absolute; width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; }
        .load-inner.load-one { left: 0%; top: 0%; border-bottom: 3px solid #5c5edc; animation: rotate1 1.15s linear infinite; }
        .load-inner.load-two { right: 0%; top: 0%; border-right: 3px solid #9147ff; animation: rotate2 1.15s 0.1s linear infinite; }
        .load-inner.load-three { right: 0%; bottom: 0%; border-top: 3px solid #3b82f6; animation: rotate3 1.15s 0.15s linear infinite; }

        @keyframes rotate1 { 0% { transform: rotateX(45deg) rotateY(-45deg) rotateZ(0deg); } 100% { transform: rotateX(45deg) rotateY(-45deg) rotateZ(360deg); } }
        @keyframes rotate2 { 0% { transform: rotateX(45deg) rotateY(45deg) rotateZ(0deg); } 100% { transform: rotateX(45deg) rotateY(45deg) rotateZ(360deg); } }
        @keyframes rotate3 { 0% { transform: rotateX(-60deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(-60deg) rotateY(0deg) rotateZ(360deg); } }

        .card { --border: 4px; --rounded: 2.5rem; width: 400px; height: auto; border-radius: var(--rounded); display: flex; align-items: center; justify-content: center; position: relative; padding: var(--border); pointer-events: auto; }
        .card::before, .card::after {
            content: ""; z-index: -1; position: absolute; will-change: auto; width: 100%; height: 100%; border-radius: var(--rounded);
            background-size: 400% 400%; animation: bg-spin 3s linear infinite;
            background-image: radial-gradient(circle farthest-side at 0 100%, #00ccb1, transparent), radial-gradient(circle farthest-side at 100% 0, #5ddcff, transparent), radial-gradient(circle farthest-side at 100% 100%, #3c67e3, transparent), radial-gradient(circle farthest-side at 0 0, #4e00c2, #0000);
        }
        .card::after { filter: blur(24px); opacity: 0.7; }
        @keyframes bg-spin { 25% { background-position: right 20% bottom 40%; } 75% { background-position: left 45% top 20%; } }
        .points_wrapper { position: absolute; inset: 0; overflow: hidden; border-radius: var(--rounded); pointer-events: none; z-index: 80; }
        .point { position: absolute; width: 4px; height: 4px; background-color: #5ddcff; border-radius: 50%; animation: float-pts infinite ease-in-out; top: -10px; }
        @keyframes float-pts { 0% { transform: translate(0, 0); } 100% { opacity: 0; transform: translate(150px, 400px); } }
        .point:nth-child(1) { left: 10%; animation-duration: 2.3s; } .point:nth-child(2) { left: 40%; animation-duration: 3s; } .point:nth-child(3) { left: 70%; animation-duration: 2.5s; }
        .card-content { position: relative; width: 100%; border-radius: calc(var(--rounded) - 4px); overflow: hidden; z-index: 7; background-color: #191c29; padding: 2rem; }

        .btn-retro {
            height: 50px; width: 100%; background: #333; display: flex; justify-content: center; cursor: pointer; align-items: center;
            font-family: Consolas, Courier New, monospace; border: solid #404c5d 1px; font-size: 15px;
            color: rgb(161, 161, 161); transition: 500ms; border-radius: 5px; text-transform: uppercase; font-weight: bold;
            background: linear-gradient(145deg, #2e2d2d, #212121);
            box-shadow: -1px -5px 15px #41465b, 5px 5px 15px #41465b, inset 5px 5px 10px #212121, inset -5px -5px 10px #212121;
        }
        .btn-starry { display: flex; justify-content: center; align-items: center; width: 100%; overflow: hidden; height: 3.5rem; background-size: 300% 300%; cursor: pointer; backdrop-filter: blur(1rem); border-radius: 1rem; transition: 0.5s; animation: gradient_301 5s ease infinite; border: double 4px transparent; background-image: linear-gradient(#212121, #212121), linear-gradient(137.48deg, #ffdb3b 10%, #fe53bb 45%, #8f51ea 67%, #0044ff 87%); background-origin: border-box; background-clip: content-box, border-box; position: relative; }
        .container-stars-wrap { position: absolute; z-index: -1; width: 100%; height: 100%; overflow: hidden; transition: 0.5s; backdrop-filter: blur(1rem); border-radius: 1rem; }
        .stars-inner { position: relative; width: 200rem; height: 200rem; }
        .stars-inner::after { content: ""; position: absolute; inset: 0; animation: animStarRotate 90s linear infinite; background-image: radial-gradient(#ffffff 1px, transparent 1%); background-size: 50px 50px; }
        .btn-text-strong { z-index: 2; font-size: 11px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 4px white; text-transform: uppercase; font-weight: 900; }
        .btn-glow-layer { position: absolute; display: flex; width: 100%; }
        .circle { width: 100%; height: 30px; filter: blur(2rem); animation: pulse_3011 4s infinite; z-index: -1; }
        .circle:nth-of-type(1) { background: rgba(254, 83, 186, 0.6); }
        .circle:nth-of-type(2) { background: rgba(142, 81, 234, 0.7); }

        .ok-btn-inner { font-size: 12px; font-weight: 900; letter-spacing: 5px; padding: 0.8rem 2rem; border-radius: 5rem; border: none; background-color: #000; color: #fff; cursor: pointer; width: 13rem; text-transform: uppercase; }
        .ok-container { position: relative; padding: 3px; background: linear-gradient(90deg, #03a9f4, #f441a5); border-radius: 5rem; transition: all 0.4s ease; display: inline-block; }
        .ok-container:hover::before { content: ""; position: absolute; inset: 0; filter: blur(1.2em); background: linear-gradient(90deg, #03a9f4, #f441a5); z-index: -1; }

        .fire-wrapper { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .ember { position: absolute; width: 3px; height: 3px; background: #ffae00; border-radius: 50%; filter: drop-shadow(0 0 5px #ff5e00); animation: float-ember var(--d) infinite ease-in-out; opacity: 0; }
        @keyframes float-ember { 0% { transform: translate(0, 0) scale(0); opacity: 0; } 20% { opacity: 1; transform: translate(var(--x1), var(--y1)) scale(1.2); } 100% { transform: translate(var(--x2), var(--y2)) scale(0); opacity: 0; } }
        .gif-container-left { position: absolute; bottom: 20px; left: 20px; width: 150px; z-index: 10; }
        .gif-container-right { position: absolute; bottom: 20px; right: 20px; width: 150px; z-index: 10; }

        @keyframes animStarRotate { from { transform: rotate(360deg); } to { transform: rotate(0); } }
        @keyframes gradient_301 { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulse_3011 { 0%, 100% { transform: scale(0.75); } 70% { transform: scale(1); } }
        .gesture-indicator { position: absolute; bottom: 15px; right: 15px; padding: 8px 18px; border-radius: 40px; font-size: 11px; font-weight: 900; background: #2563eb; }

        /* Alphabet BG wall */
        .alphabet-container { position: absolute; top: 15%; width: 100%; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; padding: 0 50px; }
    </style>
</head>
<body>

    <div id="entrance-gate" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
        <div class="fire-wrapper" id="fire-container"></div>
        <div class="gif-container-left"><div class="tenor-gif-embed" data-postid="1920796914246840111" data-share-method="host" data-aspect-ratio="1" data-width="100%"></div></div>
        <div class="gif-container-right"><div class="tenor-gif-embed" data-postid="10876026080113699763" data-share-method="host" data-aspect-ratio="1" data-width="100%"></div></div>
        <div class="alphabet-container" id="alphabet-bg"></div>
        <div class="relative z-10 text-center px-6">
            <h2 class="stranger-font text-red-700 text-5xl md:text-8xl mb-12 filter drop-shadow-[0_0_25px_rgba(185,28,28,0.9)]">WELCOME TO THE<br>UPSIDE DOWN</h2>
            <button onclick="enterTheRift()" class="glitch-btn px-12 py-5 border-4 border-red-800 text-red-600 font-black text-2xl hover:bg-red-800 hover:text-black transition-all duration-300 tracking-[0.4em] uppercase shadow-[0_0_30px_rgba(185,28,28,0.5)]">ENTER THE RIFT</button>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="loader">
            <div class="load-inner load-one"></div>
            <div class="load-inner load-two"></div>
            <div class="load-inner load-three"></div>
            <span class="loader-text">Loading...</span>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full p-8 z-10 flex flex-col md:flex-row justify-between items-start pointer-events-none">
        <div class="card">
            <div class="points_wrapper"><i class="point"></i><i class="point"></i><i class="point"></i><i class="point"></i><i class="point"></i></div>
            <div class="card-content">
                <div class="flex items-center gap-4 mb-4"><div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div><h1 class="text-xl font-black tracking-tight uppercase">Hawkins <span class="text-blue-500">Lab Pro</span></h1></div>
                <div class="bg-blue-500/5 border border-blue-500/20 p-5 rounded-3xl mb-8">
                    <p class="text-[10px] text-gray-400 leading-relaxed"><b>Open Palm</b>: Disperse<br><b>Closed Hand</b>: Single View<br><b>Point Index</b>: Carousel</p>
                </div>
                <div class="space-y-4">
                    <button onclick="openAssetModal('single')" class="btn-retro">Single Image Mode</button>
                    <button class="btn-starry" type="button" onclick="openAssetModal('batch')">
                        <strong class="btn-text-strong">Batch Carousel Mode</strong>
                        <div class="container-stars-wrap"><div class="stars-inner"></div></div>
                        <div class="btn-glow-layer"><div class="circle"></div><div class="circle"></div></div>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-6 pointer-events-auto">
            <div class="bg-black/70 backdrop-blur-xl p-2 rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden">
                <video id="input-video" style="display:none"></video>
                <canvas id="hand-canvas" width="220" height="165" class="rounded-[1.8rem]"></canvas>
                <div id="gesture-tag" class="gesture-indicator text-white shadow-xl uppercase">Ready</div>
            </div>
        </div>
    </div>

    <div id="asset-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/90 backdrop-blur-xl">
        <div class="glass-panel p-10 rounded-[3rem] w-full max-w-2xl border border-white/20 relative bg-black/80 backdrop-blur-2xl">
            <button onclick="closeAssetModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white uppercase font-bold text-xs">✕</button>
            <h2 class="text-blue-500 font-black text-sm uppercase tracking-[0.4em] mb-8 text-center">Select Asset</h2>
            <div class="grid grid-cols-4 gap-4 mb-10 max-h-[50vh] overflow-y-auto pr-2 no-scrollbar" id="modal-gallery"></div>
            <div class="flex justify-between items-center">
                <p class="text-[9px] text-gray-500 uppercase">Target: <span id="mode-hint" class="text-blue-400">Single</span></p>
                <div id="ok-btn" class="hidden">
                    <div class="ok-container"><button onclick="closeAssetModal()" class="ok-btn-inner">OK</button></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="main-canvas"></canvas>
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
        const CONFIG = { maxParticles: 4000000, samplingRes: 2048, lerpSpeed: 0.15, leftThreshold: 0.3, rightThreshold: 0.7, imageScale: 120 };
        const FIXED_ASSETS = ["assets/Demogorgon.png", "assets/st.png", "assets/max.png", "assets/billy.png","assets/vecna.png","assets/max1.jpg", "assets/st1.png", "assets/ell.png", "assets/m.png", "assets/all.png","assets/hm.png", "assets/n.png", "assets/el.png", "assets/ste.png", "assets/ds.png" ];
        let localAssets = []; let scene, camera, renderer, particles, particleMaterial, imagePlane;
        let hands, cameraUtils; let targetDispersion = 0.5, currentDispersion = 1.0;
        let isPresentationMode = false, currentModalMode = 'single';
        let baseImageData = null, rotateTextures = [], currentRotateIndex = 0;
        let lastHandX = 0.5, directionCooldown = false, selectedPaths = new Map();

        function initFire() {
            const container = document.getElementById('fire-container');
            for(let i = 0; i < 100; i++) {
                const p = document.createElement('div'); p.className = 'ember';
                p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%';
                p.style.setProperty('--x1', (Math.random() * 50 - 25) + 'px'); p.style.setProperty('--y1', (Math.random() * -50 - 10) + 'px');
                p.style.setProperty('--x2', (Math.random() * 100 - 50) + 'px'); p.style.setProperty('--y2', (Math.random() * -150 - 50) + 'px');
                p.style.setProperty('--d', (Math.random() * 5 + 3) + 's'); p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        }

        function initAlphabetBg() {
            const container = document.getElementById('alphabet-bg');
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((l, i) => {
                const span = document.createElement('span'); span.className = "letter-bulb"; span.innerText = l;
                span.style.color = ["#f87171", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#f472b6"][i % 6];
                span.style.animation = `bulb-glow ${1.5 + Math.random() * 2}s infinite ${Math.random() * 2}s`;
                container.appendChild(span);
            });
        }

        function enterTheRift() { document.getElementById('entrance-gate').classList.add('fade-out'); setTimeout(() => document.getElementById('entrance-gate').remove(), 1500); }
        function openAssetModal(mode) { currentModalMode = mode; document.getElementById('asset-modal').classList.remove('hidden'); document.getElementById('mode-hint').innerText = mode.toUpperCase(); document.getElementById('ok-btn').style.display = (mode === 'batch') ? 'block' : 'none'; renderGallery(); }
        function closeAssetModal() { document.getElementById('asset-modal').classList.add('hidden'); }
        
        function renderGallery() {
            const gallery = document.getElementById('modal-gallery'); gallery.innerHTML = '';
            [...FIXED_ASSETS, ...localAssets].forEach(src => {
                const img = document.createElement('img'); img.src = src; img.className = "w-full aspect-square rounded-2xl cursor-pointer border-2 border-transparent hover:border-blue-500 object-cover";
                if (currentModalMode === 'batch' && selectedPaths.has(src)) img.classList.add('selected-asset');
                img.onclick = () => handleAssetClick(src, img); gallery.appendChild(img);
            });
            const plus = document.createElement('div'); plus.className = "w-full aspect-square rounded-2xl bg-white/5 border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer relative";
            plus.innerHTML = `<span class="text-3xl text-blue-500">+</span><input type="file" class="absolute inset-0 opacity-0" multiple onchange="handleLocalUpload(event)">`;
            gallery.appendChild(plus);
        }

        async function handleAssetClick(src, el) {
            if (currentModalMode === 'single') { await loadPreset(src); closeAssetModal(); }
            else { 
                if (selectedPaths.has(src)) { selectedPaths.delete(src); el.classList.remove('selected-asset'); }
                else { const tex = await new THREE.TextureLoader().loadAsync(src); selectedPaths.set(src, tex); el.classList.add('selected-asset'); }
                rotateTextures = Array.from(selectedPaths.values()); 
            }
        }
        function handleLocalUpload(e) { Array.from(e.target.files).forEach(f => localAssets.push(URL.createObjectURL(f))); renderGallery(); }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 1, 15000);
            camera.position.z = 500;
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('main-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            particleMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uDispersion: { value: 1.0 }, uPixelRatio: { value: window.devicePixelRatio } },
                vertexShader: `uniform float uDispersion; attribute vec3 aTarget; attribute vec3 aRandom; attribute vec3 aColor; attribute float aSize; varying vec3 vColor; varying float vAlpha; void main() { vColor = aColor; vec3 pos = mix(aTarget, aRandom, uDispersion); vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0); gl_PointSize = aSize * (2000.0 / -mvPosition.z); gl_Position = projectionMatrix * mvPosition; vAlpha = smoothstep(-1500.0, 1000.0, mvPosition.z); }`,
                fragmentShader: `varying vec3 vColor; varying float vAlpha; void main() { if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard; gl_FragColor = vec4(vColor, vAlpha); }`,
                transparent: true, depthWrite: false
            });
            imagePlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide }));
            scene.add(imagePlane); imagePlane.visible = false;
        }

        async function loadPreset(url) {
            const img = new Image(); img.crossOrigin = "anonymous";
            img.onload = async () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                const scale = Math.min(CONFIG.samplingRes / img.width, CONFIG.samplingRes / img.height);
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                const pixels = [];
                for (let y = 0; y < canvas.height; y += 1) {
                    for (let x = 0; x < canvas.width; x += 1) {
                        const i = (y * canvas.width + x) * 4;
                        if (data[i+3] > 50) pixels.push({ x: (x - canvas.width/2)*0.12, y: (canvas.height/2 - y)*0.12, r: data[i]/255, g: data[i+1]/255, b: data[i+2]/255 });
                    }
                }
                createParticleSystem(pixels);
                const tex = await new THREE.TextureLoader().loadAsync(url);
                imagePlane.material.map = tex;
                imagePlane.material.needsUpdate = true;
            };
            img.src = url;
        }

        function createParticleSystem(pixels) {
            if (particles) scene.remove(particles);
            const count = Math.min(pixels.length, CONFIG.maxParticles);
            const geometry = new THREE.BufferGeometry();
            const targets = new Float32Array(count * 3), randoms = new Float32Array(count * 3), colors = new Float32Array(count * 3), sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const p = pixels[i]; targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = 0;
                randoms[i*3] = (Math.random()-0.5)*2500; randoms[i*3+1] = (Math.random()-0.5)*2500; randoms[i*3+2] = (Math.random()-0.5)*2500;
                colors[i*3] = p.r; colors[i*3+1] = p.g; colors[i*3+2] = p.b; sizes[i] = 0.5;
            }
            geometry.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3)); geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));
            geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3)); geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            particles = new THREE.Points(geometry, particleMaterial); scene.add(particles);
        }

        async function initMediaPipe() {
            const video = document.getElementById('input-video');
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.8 });
            hands.onResults((results) => {
                const ctx = document.getElementById('hand-canvas').getContext('2d');
                ctx.save(); ctx.clearRect(0, 0, 220, 165); ctx.scale(-1, 1); ctx.translate(-220, 0); ctx.drawImage(results.image, 0, 0, 220, 165);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const isFingersExtended = lm[8].y < lm[6].y && lm[12].y < lm[10].y;
                    const isIndexUpOnly = lm[8].y < lm[6].y && lm[12].y > lm[10].y;
                    if (isFingersExtended) { document.getElementById('gesture-tag').innerText = "CLOSED"; if(particles) particles.visible = false; imagePlane.visible = true; }
                    else if (isIndexUpOnly && rotateTextures.length > 0) {
                        const deltaX = lm[8].x - lastHandX; if (!directionCooldown && Math.abs(deltaX) > 0.08) changePhoto(deltaX > 0 ? -1 : 1);
                        lastHandX = lm[8].x;
                    } else { document.getElementById('gesture-tag').innerText = "OPEN"; if(particles) particles.visible = true; imagePlane.visible = false; targetDispersion = THREE.MathUtils.clamp((Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) - 0.1) * 3, 0, 1); }
                }
                ctx.restore();
            });
            cameraUtils = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 480, height: 360 });
            cameraUtils.start();
        }

        function changePhoto(dir) { directionCooldown = true; currentRotateIndex = (currentRotateIndex + dir + rotateTextures.length) % rotateTextures.length; imagePlane.material.map = rotateTextures[currentRotateIndex]; const aspect = rotateTextures[currentRotateIndex].image.width / rotateTextures[currentRotateIndex].image.height; imagePlane.scale.set(CONFIG.imageScale * aspect, CONFIG.imageScale, 1); setTimeout(() => directionCooldown = false, 800); }
        function animate() { requestAnimationFrame(animate); currentDispersion += (targetDispersion - currentDispersion) * CONFIG.lerpSpeed; if(particleMaterial) particleMaterial.uniforms.uDispersion.value = currentDispersion; renderer.render(scene, camera); }

        window.onload = async () => {
            initThree(); initFire(); initAlphabetBg(); generateInitialCloud();
            await initMediaPipe();
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
            animate();
        };

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => { if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) return false; };
    </script>
</body>
</html>
