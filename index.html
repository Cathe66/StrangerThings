<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkins Lab System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Inter', sans-serif;
            user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
        }
        canvas { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .selected-asset { border: 4px solid #ff69b4 !important; box-shadow: 0 0 20px rgba(255, 105, 180, 0.6); transform: scale(0.96); }
        .stranger-font { font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        #entrance-gate.fade-out { opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }

        /* --- LOADER STYLES --- */
        .loading-overlay { 
            position: fixed; inset: 0; background: #000; display: flex; align-items: center; 
            justify-content: center; z-index: 300; transition: opacity 1s ease; 
        }
        .loader {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 100px; height: 100px; perspective: 780px;
        }
        .loader .loader-text { font-size: 14px; font-weight: 700; color: #3b82f6; z-index: 10; text-transform: uppercase; letter-spacing: 2px; }
        .load-inner { position: absolute; width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; }
        .load-inner.load-one { left: 0%; top: 0%; border-bottom: 3px solid #5c5edc; animation: rotate1 1.15s linear infinite; }
        .load-inner.load-two { right: 0%; top: 0%; border-right: 3px solid #9147ff; animation: rotate2 1.15s 0.1s linear infinite; }
        .load-inner.load-three { right: 0%; bottom: 0%; border-top: 3px solid #3b82f6; animation: rotate3 1.15s 0.15s linear infinite; }
        @keyframes rotate1 { 0% { transform: rotateX(45deg) rotateY(-45deg) rotateZ(0deg); } 100% { transform: rotateX(45deg) rotateY(-45deg) rotateZ(360deg); } }
        @keyframes rotate2 { 0% { transform: rotateX(45deg) rotateY(45deg) rotateZ(0deg); } 100% { transform: rotateX(45deg) rotateY(45deg) rotateZ(360deg); } }
        @keyframes rotate3 { 0% { transform: rotateX(-60deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(-60deg) rotateY(0deg) rotateZ(360deg); } }

        /* --- UI PANEL --- */
        .card { --border: 4px; --rounded: 2.5rem; width: 400px; height: auto; border-radius: var(--rounded); display: flex; align-items: center; justify-content: center; position: relative; padding: var(--border); pointer-events: auto; }
        .card::before, .card::after {
            content: ""; z-index: -1; position: absolute; will-change: auto; width: 100%; height: 100%; border-radius: var(--rounded);
            background-size: 400% 400%; animation: bg-spin 3s linear infinite;
            background-image: radial-gradient(circle farthest-side at 0 100%, #00ccb1, transparent), radial-gradient(circle farthest-side at 100% 0, #5ddcff, transparent), radial-gradient(circle farthest-side at 100% 100%, #3c67e3, transparent), radial-gradient(circle farthest-side at 0 0, #4e00c2, #0000);
        }
        .card::after { filter: blur(24px); opacity: 0.7; }
        @keyframes bg-spin { 25% { background-position: right 20% bottom 40%; } 75% { background-position: left 45% top 20%; } }
        
        .points_wrapper { position: absolute; inset: 0; overflow: hidden; border-radius: var(--rounded); pointer-events: none; z-index: 80; }
        .point { position: absolute; width: 4px; height: 4px; background-color: #5ddcff; border-radius: 50%; animation: float-pts infinite ease-in-out; top: -10px; }
        @keyframes float-pts { 0% { transform: translate(0, 0); } 100% { opacity: 0; transform: translate(150px, 400px); } }
        .point:nth-child(1) { left: 10%; animation-duration: 2.3s; } .point:nth-child(2) { left: 40%; animation-duration: 3s; } .point:nth-child(3) { left: 70%; animation-duration: 2.5s; }
        .card-content { position: relative; width: 100%; border-radius: calc(var(--rounded) - 4px); overflow: hidden; z-index: 7; background-color: #191c29; padding: 2rem; }

        .btn-retro {
            height: 50px; width: 100%; background: #333; display: flex; justify-content: center; cursor: pointer; align-items: center;
            font-family: Consolas, Courier New, monospace; border: solid #404c5d 1px; font-size: 14px;
            color: rgb(161, 161, 161); transition: 500ms; border-radius: 5px; text-transform: uppercase; font-weight: bold;
            background: linear-gradient(145deg, #2e2d2d, #212121);
            box-shadow: -1px -5px 15px #41465b, 5px 5px 15px #41465b, inset 5px 5px 10px #212121, inset -5px -5px 10px #212121;
        }
        .btn-retro:hover { box-shadow: 1px 1px 13px #20232e, -1px -1px 13px #545b78; color: #d6d6d6; }
        
        .btn-starry { display: flex; justify-content: center; align-items: center; width: 100%; height: 3.5rem; border-radius: 1rem; position: relative; overflow: hidden; background: #212121; cursor: pointer; }
        .btn-text-strong { z-index: 2; font-size: 11px; letter-spacing: 2px; color: #fff; text-transform: uppercase; }

        .fire-wrapper { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .ember { position: absolute; width: 3px; height: 3px; background: #ffae00; border-radius: 50%; filter: drop-shadow(0 0 5px #ff5e00); animation: float-ember var(--d) infinite ease-in-out; opacity: 0; }
        @keyframes float-ember { 0% { transform: translate(0, 0) scale(0); opacity: 0; } 20% { opacity: 1; transform: translate(var(--x1), var(--y1)) scale(1.2); } 100% { transform: translate(var(--x2), var(--y2)) scale(0); opacity: 0; } }
        .gif-container-left, .gif-container-right { position: absolute; bottom: 20px; width: 150px; z-index: 10; }
        .gif-container-left { left: 20px; } .gif-container-right { right: 20px; }
        .gesture-indicator { position: absolute; bottom: 15px; right: 15px; padding: 8px 18px; border-radius: 40px; font-size: 11px; font-weight: 900; background: #2563eb; }
    </style>
</head>
<body>

    <div id="entrance-gate" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
        <div class="fire-wrapper" id="fire-container"></div>
        <div class="alphabet-container" id="alphabet-bg"></div>
        <div class="relative z-10 text-center px-6">
            <h2 class="stranger-font text-red-700 text-5xl md:text-8xl mb-12 filter drop-shadow-[0_0_25px_rgba(185,28,28,0.9)]">WELCOME TO THE<br>UPSIDE DOWN</h2>
            <button onclick="enterTheRift()" class="glitch-btn px-12 py-5 border-4 border-red-800 text-red-600 font-black text-2xl hover:bg-red-800 hover:text-black transition-all duration-300 tracking-[0.4em] uppercase shadow-[0_0_30px_rgba(185,28,28,0.5)]">ENTER THE RIFT</button>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="loader">
            <div class="load-inner load-one"></div>
            <div class="load-inner load-two"></div>
            <div class="load-inner load-three"></div>
            <span class="loader-text">Hawkins...</span>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full p-8 z-10 flex flex-col md:flex-row justify-between items-start pointer-events-none">
        <div class="card">
            <div class="points_wrapper"><i class="point"></i><i class="point"></i><i class="point"></i></div>
            <div class="card-content">
                <div class="flex items-center gap-4 mb-4"><div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div><h1 class="text-xl font-black tracking-tight uppercase">Hawkins <span class="text-blue-500">Lab Pro</span></h1></div>
                <div class="space-y-4">
                    <button onclick="openAssetModal('single')" class="btn-retro">Single Mode</button>
                    <button onclick="openAssetModal('batch')" class="btn-starry"><strong class="btn-text-strong">Batch Mode</strong></button>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-6 pointer-events-auto">
            <div class="bg-black/70 backdrop-blur-xl p-2 rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden">
                <video id="input-video" style="display:none" playsinline></video>
                <canvas id="hand-canvas" width="220" height="165" class="rounded-[1.8rem]"></canvas>
                <div id="gesture-tag" class="gesture-indicator text-white shadow-xl uppercase">Ready</div>
            </div>
        </div>
    </div>

    <div id="asset-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/90 backdrop-blur-xl">
        <div class="bg-black/80 backdrop-blur-2xl p-10 rounded-[3rem] w-full max-w-2xl border border-white/20 relative">
            <button onclick="closeAssetModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white uppercase font-bold text-xs">✕</button>
            <div class="grid grid-cols-4 gap-4 mb-10 max-h-[50vh] overflow-y-auto pr-2 no-scrollbar" id="modal-gallery"></div>
        </div>
    </div>

    <canvas id="main-canvas"></canvas>

    <script>
        const CONFIG = { maxParticles: 4000000, samplingRes: 1024, lerpSpeed: 0.15, imageScale: 120 };
        const FIXED_ASSETS = ["assets/Demogorgon.png", "assets/st.png", "assets/max.png", "assets/billy.png","assets/vecna.png","assets/max1.jpg"];
        
        let scene, camera, renderer, particles, particleMaterial, imagePlane;
        let hands, cameraHelper;
        let targetDispersion = 1.0, currentDispersion = 1.0;

        // 1. 初始化 3D 场景
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 1, 15000);
            camera.position.z = 500;
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('main-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            particleMaterial = new THREE.ShaderMaterial({
                uniforms: { uDispersion: { value: 1.0 }, uPixelRatio: { value: window.devicePixelRatio } },
                vertexShader: `uniform float uDispersion; attribute vec3 aTarget; attribute vec3 aRandom; attribute vec3 aColor; attribute float aSize; varying vec3 vColor; varying float vAlpha; void main() { vColor = aColor; vec3 pos = mix(aTarget, aRandom, uDispersion); vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0); gl_PointSize = aSize * (1500.0 / -mvPosition.z); gl_Position = projectionMatrix * mvPosition; vAlpha = smoothstep(-1000.0, 1000.0, mvPosition.z); }`,
                fragmentShader: `varying vec3 vColor; varying float vAlpha; void main() { if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard; gl_FragColor = vec4(vColor, vAlpha); }`,
                transparent: true, depthWrite: false
            });
            
            imagePlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide }));
            scene.add(imagePlane);
            imagePlane.visible = false;
        }

        // 2. 图像处理与粒子生成
        async function loadPreset(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = url;
            await img.decode();
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const scale = Math.min(512 / img.width, 512 / img.height);
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const pixels = [];
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i+3] > 128) pixels.push({ x: (x - canvas.width/2)*0.15, y: (canvas.height/2 - y)*0.15, r: data[i]/255, g: data[i+1]/255, b: data[i+2]/255 });
                }
            }
            createParticles(pixels);
            const tex = await new THREE.TextureLoader().loadAsync(url);
            imagePlane.material.map = tex;
        }

        function createParticles(pixels) {
            if (particles) scene.remove(particles);
            const count = pixels.length;
            const geo = new THREE.BufferGeometry();
            const posT = new Float32Array(count * 3), posR = new Float32Array(count * 3), col = new Float32Array(count * 3), siz = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const p = pixels[i];
                posT[i*3]=p.x; posT[i*3+1]=p.y; posT[i*3+2]=0;
                posR[i*3]=(Math.random()-0.5)*3000; posR[i*3+1]=(Math.random()-0.5)*3000; posR[i*3+2]=(Math.random()-0.5)*3000;
                col[i*3]=p.r; col[i*3+1]=p.g; col[i*3+2]=p.b; siz[i]=0.8;
            }
            geo.setAttribute('aTarget', new THREE.BufferAttribute(posT, 3));
            geo.setAttribute('aRandom', new THREE.BufferAttribute(posR, 3));
            geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
            geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
            particles = new THREE.Points(geo, particleMaterial);
            scene.add(particles);
        }

        // 3. 手势识别
        async function initMediaPipe() {
            const video = document.getElementById('input-video');
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7 });
            hands.onResults((res) => {
                const ctx = document.getElementById('hand-canvas').getContext('2d');
                ctx.save(); ctx.clearRect(0,0,220,165); ctx.scale(-1,1); ctx.translate(-220,0); ctx.drawImage(res.image,0,0,220,165);
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    const lm = res.multiHandLandmarks[0];
                    const isClosed = lm[8].y > lm[6].y && lm[12].y > lm[10].y;
                    if (isClosed) { if(particles) particles.visible=false; imagePlane.visible=true; document.getElementById('gesture-tag').innerText="CLOSED"; }
                    else { if(particles) particles.visible=true; imagePlane.visible=false; targetDispersion=0.0; document.getElementById('gesture-tag').innerText="OPEN"; }
                } else { targetDispersion=1.0; }
                ctx.restore();
            });
            cameraHelper = new window.Camera(video, { onFrame: async() => await hands.send({image: video}), width: 480, height: 360 });
            return cameraHelper.start();
        }

        // 4. 其他 UI 逻辑
        function initFire() {
            const container = document.getElementById('fire-container');
            for(let i=0; i<60; i++) {
                const p = document.createElement('div'); p.className='ember';
                p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%';
                p.style.setProperty('--x1',(Math.random()-0.5)*100+'px'); p.style.setProperty('--y1',(Math.random()-0.5)*100+'px');
                p.style.setProperty('--x2',(Math.random()-0.5)*200+'px'); p.style.setProperty('--y2',(Math.random()-0.5)*200+'px');
                p.style.setProperty('--d',Math.random()*5+3+'s'); p.style.animationDelay=Math.random()*5+'s';
                container.appendChild(p);
            }
        }
        function initAlphabet() {
            const container = document.getElementById('alphabet-bg');
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
                const s = document.createElement('span'); s.className='letter-bulb'; s.innerText=l;
                s.style.animation = `bulb-glow ${Math.random()*2+1}s infinite`;
                container.appendChild(s);
            });
        }
        function enterTheRift() { document.getElementById('entrance-gate').classList.add('fade-out'); }
        function openAssetModal() { document.getElementById('asset-modal').classList.remove('hidden'); renderGallery(); }
        function closeAssetModal() { document.getElementById('asset-modal').classList.add('hidden'); }
        function renderGallery() {
            const g = document.getElementById('modal-gallery'); g.innerHTML='';
            FIXED_ASSETS.forEach(src => {
                const img = document.createElement('img'); img.src=src; img.className="w-full aspect-square rounded-xl cursor-pointer hover:border-blue-500 border-2 border-transparent object-cover";
                img.onclick=()=>{ loadPreset(src); closeAssetModal(); }; g.appendChild(img);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            currentDispersion += (targetDispersion - currentDispersion) * CONFIG.lerpSpeed;
            if(particleMaterial) particleMaterial.uniforms.uDispersion.value = currentDispersion;
            renderer.render(scene, camera);
        }

        window.onload = async () => {
            initThree();
            initAlphabet();
            initFire();
            try {
                await initMediaPipe();
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').remove(), 1000);
            } catch (e) {
                console.error("Camera init failed", e);
                document.querySelector('.loader-text').innerText = "CAMERA ERROR";
            }
            animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
