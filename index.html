<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkins Display System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        .glass-panel { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 1s ease; }
        .gesture-indicator { position: absolute; bottom: 15px; right: 15px; padding: 8px 18px; border-radius: 40px; font-size: 11px; font-weight: 900; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="text-center">
            <div class="w-20 h-20 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-[10px] tracking-[0.5em] text-blue-500 uppercase">System Initializing...</p>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full p-8 z-10 flex flex-col md:flex-row justify-between items-start pointer-events-none">
        <div class="glass-panel p-8 rounded-[2.5rem] pointer-events-auto max-w-sm shadow-2xl">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-black tracking-tight">AETHER <span class="text-blue-500">HD</span></h1>
            </div>
            
            <div class="bg-blue-500/5 border border-blue-500/20 p-5 rounded-3xl mb-6">
                <p class="text-blue-400 font-bold text-[11px] mb-2 uppercase tracking-tighter">Visual Engine</p>
                <p class="text-blue-400 font-bold text-[11px] mb-2 uppercase tracking-tighter">Gesture Control Specifications</p>
                <p class="text-[10px] text-gray-400 leading-relaxed">
                    - <b>Open Palm</b>: Expand & disperse particles<br>
                    - <b>Clenched Fist</b>: Show single image (Mesh Mode)<br>
                    - <b>Point Index</b>: Activate image carousel<br>
                    - <b>Swipe Index</b>: Toggle carousel images (L/R)
                </p>
            </div>
            
            <div class="space-y-3">
                <div class="relative group">
                    <input type="file" id="media-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="bg-white/10 group-hover:bg-white/20 text-white transition-all text-center py-3 rounded-2xl text-[11px] font-bold tracking-widest border border-white/10">
                        SINGLE UPLOAD
                    </div>
                </div>

                <div class="relative group">
                    <input type="file" id="rotate-upload" accept="image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="bg-blue-600 group-hover:bg-blue-500 text-white transition-all text-center py-4 rounded-2xl text-[11px] font-black tracking-widest shadow-lg shadow-blue-900/40">
                        BATCH CAROUSEL UPLOAD
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-6 pointer-events-auto">
            <div class="glass-panel p-2 rounded-[2rem] overflow-hidden border border-white/10 shadow-2xl">
                <video id="input-video" style="display:none"></video>
                <canvas id="hand-canvas" width="220" height="165" class="rounded-[1.8rem]"></canvas>
                <div id="gesture-tag" class="gesture-indicator bg-blue-600 text-white shadow-xl">READY</div>
            </div>
        </div>
    </div>

    <canvas id="main-canvas"></canvas>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uDispersion;
        uniform float uPixelRatio;
        attribute vec3 aTarget;
        attribute vec3 aRandom;
        attribute vec3 aColor;
        attribute float aSize;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            vColor = aColor;
            vec3 pos = mix(aTarget, aRandom, uDispersion);
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = aSize * (1800.0 / -mvPosition.z) * uPixelRatio;
            gl_Position = projectionMatrix * mvPosition;
            vAlpha = smoothstep(-1500.0, 1000.0, mvPosition.z);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            float r = distance(gl_PointCoord, vec2(0.5));
            if (r > 0.5) discard;
            float alpha = smoothstep(0.5, 0.1, r) * vAlpha;
            gl_FragColor = vec4(vColor, alpha);
        }
    </script>

    <script>
        const CONFIG = {
            maxParticles: 4000000, 
            samplingRes: 1024,
            lerpSpeed: 0.12,
            leftThreshold: 0.35,
            rightThreshold: 0.65,
            imageScale: 100 
        };

        let scene, camera, renderer, particles, particleMaterial;
        let imagePlane; 
        let hands, cameraUtils;
        let targetDispersion = 0.5, currentDispersion = 1.0;
        
        let isPresentationMode = false;
        let baseImageData = null;
        let rotateTextures = [];
        let currentRotateIndex = 0;
        let lastDirection = null;
        let directionCooldown = false;

        window.onload = async () => {
            initThree();
            initMediaPipe();
            setupEvents();
            generateInitialCloud();
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
            animate();
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 1, 15000);
            camera.position.z = 500; 
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('main-canvas'), 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            particleMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uDispersion: { value: 1.0 },
                    uPixelRatio: { value: renderer.getPixelRatio() }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true,
                blending: THREE.NormalBlending,
                depthWrite: false,
                depthTest: true
            });

            const planeGeo = new THREE.PlaneGeometry(1, 1);
            const planeMat = new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide });
            imagePlane = new THREE.Mesh(planeGeo, planeMat);
            imagePlane.visible = false; 
            scene.add(imagePlane);
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('media-upload').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    baseImageData = await processImageToParticles(file);
                    createParticleSystem(baseImageData);
                }
            });

            document.getElementById('rotate-upload').addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                rotateTextures = [];
                const loader = new THREE.TextureLoader();
                for (const file of files) {
                    const url = URL.createObjectURL(file);
                    const tex = await loader.loadAsync(url);
                    rotateTextures.push(tex);
                }
                document.getElementById('gesture-tag').innerText = `HD READY: ${rotateTextures.length}`;
            });
        }

        async function processImageToParticles(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = Math.min(CONFIG.samplingRes / img.width, CONFIG.samplingRes / img.height);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    const pixels = [];
                    const offsets = [{dx: 0, dy: 0}, {dx: 0.5, dy: 0.5}];

                    for (let y = 0; y < canvas.height; y += 1) { 
                        for (let x = 0; x < canvas.width; x += 1) {
                            const i = (y * canvas.width + x) * 4;
                            if (data[i+3] > 100) { 
                                const r = data[i]/255, g = data[i+1]/255, b = data[i+2]/255;
                                offsets.forEach(off => {
                                    pixels.push({
                                        x: (x + off.dx - canvas.width / 2) * 0.25,
                                        y: (canvas.height / 2 - (y + off.dy)) * 0.25,
                                        r: r, g: g, b: b
                                    });
                                });
                            }
                        }
                    }
                    resolve(pixels);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        function createParticleSystem(pixels) {
            if (particles) scene.remove(particles);
            const count = Math.min(pixels.length, CONFIG.maxParticles);
            const geometry = new THREE.BufferGeometry();
            const targets = new Float32Array(count * 3);
            const randoms = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const p = pixels[i];
                const i3 = i * 3;
                targets[i3] = p.x; targets[i3+1] = p.y; targets[i3+2] = 0;
                randoms[i3] = (Math.random()-0.5) * 2000;
                randoms[i3+1] = (Math.random()-0.5) * 2000;
                randoms[i3+2] = (Math.random()-0.5) * 2000;
                colors[i3] = p.r; colors[i3+1] = p.g; colors[i3+2] = p.b;
                sizes[i] = 0.3 + Math.random() * 0.5; 
            }
            geometry.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));
            geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
            
            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);
        }

        function generateInitialCloud() {
            const dots = [];
            for(let i=0; i<400000; i++){ 
                dots.push({x: (Math.random()-0.5)*250, y: (Math.random()-0.5)*200, r:0.0, g:0.1, b:0.3});
            }
            createParticleSystem(dots);
        }

        function updateImagePlane() {
            if (rotateTextures.length === 0) return;
            const tex = rotateTextures[currentRotateIndex];
            imagePlane.material.map = tex;
            const aspect = tex.image.width / tex.image.height;
            imagePlane.scale.set(CONFIG.imageScale * aspect, CONFIG.imageScale, 1);
            imagePlane.material.needsUpdate = true;
        }

        async function initMediaPipe() {
            const video = document.getElementById('input-video');
            const handCanvas = document.getElementById('hand-canvas');
            const ctx = handCanvas.getContext('2d');
            const tag = document.getElementById('gesture-tag');

            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });

            hands.onResults((results) => {
                ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);
                ctx.save();
                ctx.scale(-1, 1); ctx.translate(-handCanvas.width, 0);
                ctx.drawImage(results.image, 0, 0, handCanvas.width, handCanvas.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const isIndexUp = lm[8].y < lm[6].y && lm[12].y > lm[10].y; 

                    if (isIndexUp && rotateTextures.length > 0) {
                        if (!isPresentationMode) {
                            isPresentationMode = true;
                            if (particles) particles.visible = false; 
                            imagePlane.visible = true;
                            updateImagePlane();
                        }
                        const indexX = lm[8].x;
                        let currentDirection = 'center';
                        if (indexX < CONFIG.leftThreshold) currentDirection = 'left';
                        else if (indexX > CONFIG.rightThreshold) currentDirection = 'right';

                        if (!directionCooldown && currentDirection !== 'center' && currentDirection !== lastDirection) {
                            if (currentDirection === 'left') changePhoto(-1);
                            else if (currentDirection === 'right') changePhoto(1);
                        }
                        lastDirection = currentDirection;
                        tag.innerText = currentDirection === 'center' ? `FRAME ${currentRotateIndex + 1}` : currentDirection.toUpperCase();
                        tag.style.background = "#10b981";
                    } else {
                        if (isPresentationMode) {
                            isPresentationMode = false;
                            imagePlane.visible = false;
                            if (particles) particles.visible = true;
                        }
                        const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                        targetDispersion = THREE.MathUtils.clamp((pinch - 0.1) * 3, 0, 1);
                        tag.innerText = "READY";
                        tag.style.background = "#3b82f6";
                        lastDirection = null;
                    }
                }
                ctx.restore();
            });

            cameraUtils = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 480, height: 360 });
            cameraUtils.start();
        }

        function changePhoto(dir) {
            directionCooldown = true;
            currentRotateIndex = (currentRotateIndex + dir + rotateTextures.length) % rotateTextures.length;
            updateImagePlane();
            setTimeout(() => { directionCooldown = false; }, 800);
        }

        function animate() {
            requestAnimationFrame(animate);
            currentDispersion += (targetDispersion - currentDispersion) * CONFIG.lerpSpeed;
            particleMaterial.uniforms.uDispersion.value = currentDispersion;
            particleMaterial.uniforms.uTime.value = performance.now() * 0.001;
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
