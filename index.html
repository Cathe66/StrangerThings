<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkins Lab System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        .glass-panel { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 1s ease; }
        .gesture-indicator { position: absolute; bottom: 15px; right: 15px; padding: 8px 18px; border-radius: 40px; font-size: 11px; font-weight: 900; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .selected-asset {
            border: 4px solid #ff69b4 !important;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            transform: scale(0.96);
        }

        .stranger-font { font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        #entrance-gate.fade-out { opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }
        
        .alphabet-container {
            position: absolute; top: 15%; width: 100%; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; padding: 0 50px;
        }
        .letter-bulb {
            font-family: 'serif'; font-weight: bold; font-size: 2rem; color: #333;
            text-shadow: 0 0 2px rgba(255,255,255,0.2); transition: all 0.3s;
        }
        @keyframes bulb-glow {
            0%, 100% { filter: brightness(0.3) blur(0px); text-shadow: none; }
            50% { filter: brightness(1.5) blur(1px); text-shadow: 0 0 15px currentColor, 0 0 30px currentColor; }
        }

        .glitch-btn:hover { animation: btn-glitch 0.3s infinite; }
        @keyframes btn-glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div id="entrance-gate" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
        <div class="alphabet-container" id="alphabet-bg"></div>
        <div class="relative z-10 text-center px-6">
            <h2 class="stranger-font text-red-700 text-5xl md:text-8xl mb-12 filter drop-shadow-[0_0_25px_rgba(185,28,28,0.9)]">
                WELCOME TO THE<br>UPSIDE DOWN
            </h2>
            <button onclick="enterTheRift()" class="glitch-btn px-12 py-5 border-4 border-red-800 text-red-600 font-black text-2xl hover:bg-red-800 hover:text-black transition-all duration-300 tracking-[0.4em] uppercase shadow-[0_0_30px_rgba(185,28,28,0.5)]">
                ENTER THE RIFT
            </button>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="text-center">
            <div class="w-20 h-20 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-[10px] tracking-[0.5em] text-blue-500 uppercase">System Initializing...</p>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full p-8 z-10 flex flex-col md:flex-row justify-between items-start pointer-events-none">
        <div class="glass-panel p-8 rounded-[2.5rem] pointer-events-auto max-w-sm shadow-2xl">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-black tracking-tight uppercase">Hawkins <span class="text-blue-500">Lab Pro</span></h1>
            </div>
            
            <div class="bg-blue-500/5 border border-blue-500/20 p-5 rounded-3xl mb-8">
                <p class="text-blue-400 font-bold text-[11px] mb-2 uppercase tracking-tighter">Gesture Control Specs</p>
                <p class="text-[10px] text-gray-400 leading-relaxed">
                    - <b>Open Palm</b>: Disperse Particles<br>
                    - <b>Closed Hand</b>: Show Single Image<br>
                    - <b>Point Index</b>: Activate Carousel<br>
                    - <b>Swipe Index</b>: Switch Images (L/R)
                </p>
            </div>

            <div class="space-y-4">
                <button onclick="openAssetModal('single')" class="w-full bg-white/10 hover:bg-white/20 text-white transition-all py-4 rounded-2xl text-[11px] font-bold tracking-widest border border-white/10 uppercase">
                    Single Image Mode
                </button>
                <button onclick="openAssetModal('batch')" class="w-full bg-blue-600 hover:bg-blue-500 text-white transition-all py-5 rounded-2xl text-[11px] font-black tracking-widest shadow-lg shadow-blue-900/40 uppercase">
                    Batch Carousel Mode
                </button>
            </div>
        </div>

        <div class="flex flex-col items-end gap-6 pointer-events-auto">
            <div class="glass-panel p-2 rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden">
                <video id="input-video" style="display:none"></video>
                <canvas id="hand-canvas" width="220" height="165" class="rounded-[1.8rem]"></canvas>
                <div id="gesture-tag" class="gesture-indicator bg-blue-600 text-white shadow-xl">READY</div>
            </div>
        </div>
    </div>

    <div id="asset-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/90 backdrop-blur-xl">
        <div class="glass-panel p-10 rounded-[3rem] w-full max-w-2xl border border-white/20 relative">
            <button onclick="closeAssetModal()" class="absolute top-8 right-8 text-gray-500 hover:text-white transition-colors uppercase font-bold text-xs tracking-widest">✕ Close</button>
            <h2 id="modal-title" class="text-blue-500 font-black text-sm uppercase tracking-[0.4em] mb-8 text-center">Select Research Asset</h2>
            <div class="grid grid-cols-4 gap-4 mb-10 max-h-[50vh] overflow-y-auto pr-2 no-scrollbar" id="modal-gallery"></div>
            <div class="flex justify-between items-center">
                <p class="text-[9px] text-gray-500 tracking-widest uppercase">Target Mode: <span id="mode-hint" class="text-blue-400">Single</span></p>
                <button onclick="closeAssetModal()" id="ok-btn" class="hidden px-8 py-2 border border-blue-500 text-[11px] text-blue-400 hover:bg-blue-500 hover:text-white tracking-[0.2em] uppercase font-black transition-all">OK</button>
            </div>
        </div>
    </div>

    <canvas id="main-canvas"></canvas>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uDispersion;
        uniform float uPixelRatio;
        attribute vec3 aTarget;
        attribute vec3 aRandom;
        attribute vec3 aColor;
        attribute float aSize;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            vColor = aColor;
            vec3 pos = mix(aTarget, aRandom, uDispersion);
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = aSize * (2000.0 / -mvPosition.z) * uPixelRatio;
            gl_Position = projectionMatrix * mvPosition;
            vAlpha = smoothstep(-1500.0, 1000.0, mvPosition.z);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            float r = distance(gl_PointCoord, vec2(0.5));
            if (r > 0.5) discard;
            float alpha = smoothstep(0.5, 0.2, r) * vAlpha;
            gl_FragColor = vec4(vColor, alpha);
        }
    </script>

    <script>
        // High Density Configuration
        const CONFIG = { maxParticles: 4000000, samplingRes: 2048, lerpSpeed: 0.15, leftThreshold: 0.3, rightThreshold: 0.7, imageScale: 140 };
        const FIXED_ASSETS = [
             "assets/Demogorgon.png", "assets/st.png", "assets/max.png", "assets/billy.png","assets/vecna.png","assets/max1.jpg",
            "assets/st1.png", "assets/ell.png", "assets/m.png", "assets/all.png","assets/hm.png",
            "assets/n.png", "assets/el.png", "assets/ste.png", "assets/ds.png"
        ];
        
        let localAssets = []; 
        let scene, camera, renderer, particles, particleMaterial, imagePlane;
        let hands, cameraUtils;
        let targetDispersion = 0.5, currentDispersion = 1.0;
        let isPresentationMode = false, currentModalMode = 'single';
        let baseImageData = null, rotateTextures = [], currentRotateIndex = 0;
        let lastHandX = 0.5, directionCooldown = false;
        let selectedPaths = new Map();

        // Alphabet Wall Background
        function initAlphabetBg() {
            const container = document.getElementById('alphabet-bg');
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            const colors = ["#f87171", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#f472b6"];
            letters.forEach((l, i) => {
                const span = document.createElement('span');
                span.className = "letter-bulb";
                span.innerText = l;
                span.style.color = colors[i % colors.length];
                span.style.animation = `bulb-glow ${1.5 + Math.random() * 2}s infinite ${Math.random() * 2}s`;
                container.appendChild(span);
            });
        }

        function enterTheRift() {
            const gate = document.getElementById('entrance-gate');
            gate.classList.add('fade-out');
            setTimeout(() => gate.remove(), 1500);
        }

        // Modal Logic
        function openAssetModal(mode) {
            currentModalMode = mode;
            document.getElementById('asset-modal').classList.remove('hidden');
            document.getElementById('mode-hint').innerText = mode.toUpperCase();
            document.getElementById('ok-btn').style.display = (mode === 'batch') ? 'block' : 'none';
            renderGallery();
        }
        function closeAssetModal() { document.getElementById('asset-modal').classList.add('hidden'); }

        function renderGallery() {
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = '';
            const allAssets = [...FIXED_ASSETS, ...localAssets];
            allAssets.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.className = "w-full aspect-square rounded-2xl cursor-pointer border-2 border-transparent hover:border-blue-500 transition-all object-cover";
                if (currentModalMode === 'batch' && selectedPaths.has(src)) img.classList.add('selected-asset');
                img.onclick = () => handleAssetClick(src, img);
                gallery.appendChild(img);
            });
            const plus = document.createElement('div');
            plus.className = "w-full aspect-square rounded-2xl bg-white/5 border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer hover:bg-white/10 hover:border-blue-500 transition-all relative";
            plus.innerHTML = `<span class="text-3xl text-blue-500 font-thin">+</span><input type="file" id="local-upload" class="absolute inset-0 opacity-0 cursor-pointer" multiple>`;
            gallery.appendChild(plus);
            document.getElementById('local-upload').onchange = (e) => handleLocalUpload(e);
        }

        async function handleAssetClick(src, el) {
            if (currentModalMode === 'single') {
                await loadPreset(src);
                closeAssetModal();
            } else {
                if (selectedPaths.has(src)) {
                    selectedPaths.delete(src);
                    el.classList.remove('selected-asset');
                } else {
                    const tex = await new THREE.TextureLoader().loadAsync(src);
                    selectedPaths.set(src, tex);
                    el.classList.add('selected-asset');
                }
                rotateTextures = Array.from(selectedPaths.values());
                document.getElementById('gesture-tag').innerText = `BATCH: ${rotateTextures.length}`;
            }
        }

        async function handleLocalUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            for (const f of files) {
                const url = URL.createObjectURL(f);
                localAssets.push(url);
            }
            renderGallery();
        }

        window.onload = async () => {
            initAlphabetBg();
            initThree(); initMediaPipe(); generateInitialCloud();
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
            animate();
        };

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 1, 15000);
            camera.position.z = 500;
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('main-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            particleMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uDispersion: { value: 1.0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true, blending: THREE.NormalBlending, depthWrite: false
            });
            imagePlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide }));
            imagePlane.visible = false;
            scene.add(imagePlane);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function loadPreset(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = async () => {
                baseImageData = await processImage(img);
                createParticleSystem(baseImageData);
                imagePlane.material.map = await new THREE.TextureLoader().loadAsync(url);
            };
            img.src = url;
        }

        async function processImage(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const scale = Math.min(CONFIG.samplingRes / img.width, CONFIG.samplingRes / img.height);
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const pixels = [];
            const step = 1; 
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i+3] > 50) {
                        pixels.push({ 
                            x: (x - canvas.width/2)*0.15, 
                            y: (canvas.height/2 - y)*0.15, 
                            r: data[i]/255, g: data[i+1]/255, b: data[i+2]/255 
                        });
                    }
                }
            }
            return pixels;
        }

        function createParticleSystem(pixels) {
            if (particles) scene.remove(particles);
            const count = Math.min(pixels.length, CONFIG.maxParticles);
            const geometry = new THREE.BufferGeometry();
            const targets = new Float32Array(count * 3), randoms = new Float32Array(count * 3), colors = new Float32Array(count * 3), sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const p = pixels[i];
                targets[i*3] = p.x; targets[i*3+1] = p.y; targets[i*3+2] = 0;
                randoms[i*3] = (Math.random()-0.5)*2500; randoms[i*3+1] = (Math.random()-0.5)*2500; randoms[i*3+2] = (Math.random()-0.5)*2500;
                colors[i*3] = p.r; colors[i*3+1] = p.g; colors[i*3+2] = p.b;
                sizes[i] = 0.25 + Math.random() * 0.4;
            }
            geometry.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));
            geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
            particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);
        }

        function generateInitialCloud() {
            const dots = [];
            for(let i=0; i<500000; i++) dots.push({x: (Math.random()-0.5)*300, y: (Math.random()-0.5)*250, r:0, g:0.1, b:0.4});
            createParticleSystem(dots);
        }

        async function initMediaPipe() {
            const video = document.getElementById('input-video');
            const handCanvas = document.getElementById('hand-canvas');
            const ctx = handCanvas.getContext('2d');
            const tag = document.getElementById('gesture-tag');
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });
            hands.onResults((results) => {
                ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);
                ctx.save(); ctx.scale(-1, 1); ctx.translate(-handCanvas.width, 0);
                ctx.drawImage(results.image, 0, 0, handCanvas.width, handCanvas.height);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const isFingersExtended = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y;
                    const isFingersClosed = Math.abs(lm[8].x - lm[12].x) < 0.03 && Math.abs(lm[12].x - lm[16].x) < 0.03;
                    const isIndexUpOnly = lm[8].y < lm[6].y && lm[12].y > lm[10].y; 
                    if (isFingersExtended && isFingersClosed) {
                        tag.innerText = "CLOSED: SINGLE VIEW"; tag.style.background = "#ef4444";
                        if (particles) particles.visible = false; imagePlane.visible = true; isPresentationMode = true;
                    } else if (isIndexUpOnly && rotateTextures.length > 0) {
                        tag.innerText = `INDEX: CAROUSEL ${currentRotateIndex + 1}`; tag.style.background = "#10b981";
                        if (particles) particles.visible = false; imagePlane.visible = true; isPresentationMode = true;
                        const deltaX = lm[8].x - lastHandX;
                        if (!directionCooldown && Math.abs(deltaX) > 0.08) changePhoto(deltaX > 0 ? -1 : 1);
                        lastHandX = lm[8].x;
                    } else {
                        tag.innerText = "OPEN: PARTICLES"; tag.style.background = "#3b82f6";
                        if (particles) particles.visible = true; imagePlane.visible = false; isPresentationMode = false;
                        const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                        targetDispersion = THREE.MathUtils.clamp((pinch - 0.1) * 3, 0, 1);
                    }
                }
                ctx.restore();
            });
            cameraUtils = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 480, height: 360 });
            cameraUtils.start();
        }

        function changePhoto(dir) {
            if (rotateTextures.length === 0) return;
            directionCooldown = true;
            currentRotateIndex = (currentRotateIndex + dir + rotateTextures.length) % rotateTextures.length;
            imagePlane.material.map = rotateTextures[currentRotateIndex];
            const aspect = rotateTextures[currentRotateIndex].image.width / rotateTextures[currentRotateIndex].image.height;
            imagePlane.scale.set(CONFIG.imageScale * aspect, CONFIG.imageScale, 1);
            setTimeout(() => directionCooldown = false, 800);
        }

        function animate() {
            requestAnimationFrame(animate);
            currentDispersion += (targetDispersion - currentDispersion) * CONFIG.lerpSpeed;
            particleMaterial.uniforms.uDispersion.value = currentDispersion;
            particleMaterial.uniforms.uTime.value = performance.now() * 0.001;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
